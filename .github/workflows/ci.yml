name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: hustcer/setup-moonbit@v1.22
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --deny-warn
      - run: moon test --target native --deny-warn
      - run: moon test --target js -p SongYZZZ/moon-liberty --deny-warn
      - run: moon test --target wasm-gc -p SongYZZZ/moon-liberty --deny-warn
      - run: moon info
      - run: moon build --release --deny-warn
      - name: CLI acceptance and submission identity
        run: python3 scripts/verify.py --executable _build/native/release/build/cmd/moon-liberty/moon-liberty.exe --identity
      - name: Standard edition and format/evaluation cases
        run: python3 scripts/check-standard.py --executable _build/native/release/build/cmd/moon-liberty/moon-liberty.exe
      - name: Fetch fixed independent reference parser and license
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-oracle.ps1
      - name: Independent real-library interoperability
        run: python3 scripts/oracle_check.py --executable _build/native/release/build/cmd/moon-liberty/moon-liberty.exe
      - name: Fetch immutable multi-source corpus and license texts
        run: python3 scripts/fetch-corpus.py
      - name: Install separate test-only corpus reader
        run: python3 -m pip install --target .tools/corpus-oracle -r scripts/corpus-oracle-requirements.txt
      - name: Multi-source structure and independent numerical checks
        run: python3 scripts/corpus_check.py --executable _build/native/release/build/cmd/moon-liberty/moon-liberty.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            artifacts/verification.json
            artifacts/standard-cases.json
            artifacts/oracle/report.json
            artifacts/corpus/report.json
